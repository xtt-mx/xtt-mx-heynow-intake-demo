[general]
static=yes
writeprotect=yes
clearglobalvars=no

; Llamadas que llegan desde el navegador (endpoint WebRTC de pjsip.conf).
; Solo existe la extensión "preconsulta": cualquier otro destino recibe 404.
[from-web]
exten => preconsulta,1,NoOp(Preconsulta web ${UNIQUEID})
 ; Tope de llamadas simultáneas: HeyNow cobra la voz por canales concurrentes.
 same => n,Set(GROUP()=preconsulta)
 same => n,GotoIf($[${GROUP_COUNT(preconsulta)} > ${ENV(MAX_CONCURRENT_CALLS)}]?busy)
 ; Duración máxima de una llamada, por si alguien deja la pestaña abierta.
 same => n,Set(TIMEOUT(absolute)=${ENV(MAX_CALL_SECONDS)})
 ; Variables que pide HeyNow. El token se lee del entorno del contenedor (nunca del
 ; disco) y el prefijo "_" hace que se herede al canal WebSocket.
 same => n,Set(HEY_DID=${ENV(HEY_DID)})
 same => n,Set(_HEY_AUTH_TOKEN=${ENV(HEY_AUTH_TOKEN)})
 same => n,Set(HEY_RESUME=)
 same => n,Set(CALLERID(num)=web)
 ; Línea tomada literalmente de las instrucciones del portal de HeyNow.
 same => n,Dial(WebSocket/hey-realtime/c(slin)nf(json)v(did=${URIENCODE(${HEY_DID})},caller_id=${URIENCODE(${CALLERID(num)})},call=${UNIQUEID},resume=${HEY_RESUME}),60,g)
 same => n,NoOp(Fin de la llamada: DIALSTATUS=${DIALSTATUS})
 same => n,Hangup()
 same => n(busy),NoOp(Demasiadas llamadas simultáneas)
 same => n,Busy(5)
