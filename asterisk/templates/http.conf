; Servidor HTTP de Asterisk. Solo se publica el puerto TLS 8089, que el navegador usa
; para el WebSocket SIP (wss://PUBLIC_DOMAIN:8089/ws). El HTTP plano queda en localhost.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/letsencrypt/live/${PUBLIC_DOMAIN}/fullchain.pem
tlsprivatekey=/etc/letsencrypt/live/${PUBLIC_DOMAIN}/privkey.pem
