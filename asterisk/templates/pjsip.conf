; Un solo endpoint WebRTC: el softphone de la página /llamar. No hay troncales SIP
; ni registro de teléfonos: la llamada sale hacia HeyNow por WebSocket (chan_websocket).

[global]
type=global
user_agent=Preconsulta-Demo

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

; El nombre del endpoint debe ser igual al usuario: Asterisk identifica la llamada por
; el usuario del From (identify_by=username).
[${SIP_WEB_USER}]
type=endpoint
transport=transport-wss
context=from-web
disallow=all
; G.711: lo soportan todos los navegadores y se convierte a slin (lo que pide HeyNow)
; sin módulos de códec adicionales.
allow=ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
auth=${SIP_WEB_USER}-auth
aors=${SIP_WEB_USER}
identify_by=username
allow_subscribe=no

[${SIP_WEB_USER}-auth]
type=auth
auth_type=userpass
username=${SIP_WEB_USER}
password=${SIP_WEB_PASSWORD}

[${SIP_WEB_USER}]
type=aor
max_contacts=20
remove_existing=yes
